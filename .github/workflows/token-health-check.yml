name: Daily Platform Token Health Check

on:
  schedule:
    # 07:00 UTC daily — after drive-token-check (06:00) and before uploads start
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write credentials
        env:
          INSTAGRAM_CREDS_JSON: ${{ secrets.INSTAGRAM_CREDENTIALS }}
          YOUTUBE_CREDS_JSON: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: |
          mkdir -p credentials
          if [ -n "$INSTAGRAM_CREDS_JSON" ]; then
            echo "$INSTAGRAM_CREDS_JSON" > credentials/all_niches_ig.json
          fi
          if [ -n "$YOUTUBE_CREDS_JSON" ]; then
            echo "$YOUTUBE_CREDS_JSON" > credentials/mythology_yt.json
          fi

      - name: Check platform tokens
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python scripts/platform_token_check.py

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os, json, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat  = os.environ["TELEGRAM_CHAT_ID"]
          url   = os.environ["RUN_URL"]
          msg   = f"\u274c *token-health-check crashed*\n{url}"
          data  = json.dumps({"chat_id": chat, "text": msg, "parse_mode": "Markdown"}).encode()
          urllib.request.urlopen(urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data, headers={"Content-Type": "application/json"}
          ))
          EOF
