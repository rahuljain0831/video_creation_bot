name: Skillstotraineyes Weekly Drill

on:
  # Wednesday 19:00 IST = 13:30 UTC
  schedule:
    - cron: '30 13 * * 3'
  workflow_dispatch:
    inputs:
      family:
        description: 'Drill family to force (default: slow_pursuit)'
        required: false
        default: 'slow_pursuit'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate required secrets
        env:
          SA_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          PENDING_ID: ${{ secrets.GOOGLE_DRIVE_PENDING_ID }}
          IG_CREDS: ${{ secrets.SKILLSTOTRAINEYES_IG_CREDENTIALS }}
        run: |
          fail=0
          [ -z "$SA_JSON" ]    && echo "::error::GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON not set" && fail=1
          [ -z "$FOLDER_ID" ]  && echo "::error::GOOGLE_DRIVE_FOLDER_ID not set" && fail=1
          [ -z "$PENDING_ID" ] && echo "::error::GOOGLE_DRIVE_PENDING_ID not set" && fail=1
          [ -z "$IG_CREDS" ]   && echo "::error::SKILLSTOTRAINEYES_IG_CREDENTIALS not set" && fail=1
          [ $fail -eq 1 ] && exit 1
          echo "All required secrets present"

      - name: Write credentials files
        env:
          GOOGLE_DRIVE_SA_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          SKILLSTOTRAINEYES_IG_CREDS_JSON: ${{ secrets.SKILLSTOTRAINEYES_IG_CREDENTIALS }}
        run: |
          mkdir -p credentials
          echo "$GOOGLE_DRIVE_SA_JSON" > credentials/drive_service_account.json
          echo "$SKILLSTOTRAINEYES_IG_CREDS_JSON" > credentials/skillstotraineyes_ig.json

      - name: Init DB
        run: python db/init_db.py

      - name: Generate and publish drill
        env:
          GOOGLE_DRIVE_AUTH: service_account
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: credentials/drive_service_account.json
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_PENDING_ID: ${{ secrets.GOOGLE_DRIVE_PENDING_ID }}
          GOOGLE_DRIVE_UPLOADED_ID: ${{ secrets.GOOGLE_DRIVE_UPLOADED_ID }}
          GOOGLE_DRIVE_FAILED_ID: ${{ secrets.GOOGLE_DRIVE_FAILED_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAMILY: ${{ github.event.inputs.family || 'slow_pursuit' }}
        run: python run_skillstotraineyes.py --family "$FAMILY" --no-llm

      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os, json, urllib.request
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat  = os.environ["TELEGRAM_CHAT_ID"]
          url   = os.environ["RUN_URL"]
          msg   = f"❌ *skillstotraineyes-weekly failed*\n{url}"
          data  = json.dumps({"chat_id": chat, "text": msg, "parse_mode": "Markdown"}).encode()
          urllib.request.urlopen(urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data, headers={"Content-Type": "application/json"}
          ))
          EOF
